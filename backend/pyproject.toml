[project]
name = "assist"
version = "1.0.0"
description = "Hours, miles, and the day ahead"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.34.0",
  "fpdf2>=2.8.3",
  "httpx>=0.28.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
