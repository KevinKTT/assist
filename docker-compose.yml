# Host folder for the database. Example:
#   ASSIST_DATA=/srv/assist docker compose up -d
# Chrome can install it on the phone once this is served over HTTPS.
services:
  assist:
    build: .
    image: assist
    container_name: assist
    ports:
      - "${ASSIST_PORT:-8080}:8080"
    environment:
      ASSIST_DATA_DIR: /data
      ASSIST_BACKUP_DIR: /backups
      # Optional off-host copies. Leave blank to keep backups local only.
      SEAFILE_URL: ${SEAFILE_URL:-}
      SEAFILE_TOKEN: ${SEAFILE_TOKEN:-}
      SEAFILE_REPO_ID: ${SEAFILE_REPO_ID:-}
      SEAFILE_DIR: ${SEAFILE_DIR:-/assist-backups}
    volumes:
      - ${ASSIST_DATA:-./data}:/data
      - ${ASSIST_BACKUPS:-./backups}:/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
